<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bury or Build · Underground Settlement</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{--soot:#0B0908;--ochre:#FF7A1A;--cyan:#3DF2E0;--alarm:#FF3B5C;--bone:#EDE3D2;--dim:#9C8B7A;--ok:#8CE07A;--magenta:#FF2BD6;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--soot);color:var(--bone);font-family:"JetBrains Mono",Consolas,monospace;overflow:hidden}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}
  .crt{position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px);mix-blend-mode:multiply}
  .vig{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%)}
  .hud{position:fixed;z-index:6;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);pointer-events:none}
  .hud.tl{left:24px;top:18px}
  .hud.tr{right:24px;top:18px;text-align:right}
  .hud.bl{left:24px;bottom:18px;max-width:360px}
  .hud.br{right:24px;bottom:18px;text-align:right}
  h1{margin:0;font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-weight:800;font-size:44px;letter-spacing:.04em;color:var(--ochre);line-height:.95;text-shadow:0 0 18px rgba(255,122,26,.55)}
  h1 span{color:var(--cyan);text-shadow:0 0 18px rgba(61,242,224,.6)}
  .row{display:flex;justify-content:space-between;gap:18px;border-top:1px solid #3A2A20;padding:5px 0}
  .row b{color:var(--bone);font-weight:600;font-variant-numeric:tabular-nums}
  .row b.cy{color:var(--cyan)}.row b.oc{color:var(--ochre)}.row b.al{color:var(--alarm)}.row b.ok{color:var(--ok)}
  .tag{display:inline-block;border:1px solid var(--cyan);color:var(--cyan);padding:2px 8px;margin-top:8px;box-shadow:0 0 10px rgba(61,242,224,.35);animation:blink 2.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;box-shadow:0 0 8px currentColor}
  .hint{margin-top:10px;color:#6b5c4d}
  select{pointer-events:auto;background:#16110E;color:var(--cyan);border:1px solid #3A2A20;font:inherit;padding:4px 8px;letter-spacing:.1em;text-transform:uppercase}
  @media (max-width:600px){h1{font-size:30px}.hud.bl{max-width:60vw}.hud.br{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nogl" style="display:none;position:fixed;inset:0;z-index:9;display:none;place-items:center;color:#FF3B5C;font-size:13px;letter-spacing:.1em;text-align:center;padding:24px"></div>
<div class="vig"></div><div class="crt"></div>

<div class="hud tl">
  <h1>BURY <span>//</span> BUILD</h1>
  <div style="margin-top:6px">Sol 0 · Crew 100 · Resupply T−730</div>
  <div class="tag">SUBSURFACE HAB · SECTION VIEW</div>
</div>

<div class="hud tr">
  <div>SITE <select id="site">
    <option value="jezero">Jezero (−2.5 km)</option>
    <option value="gale">Gale (−4.4 km)</option>
    <option value="arsia">Arsia Mons (+8.5 km)</option>
    <option value="hellas">Hellas basin (−7.0 km)</option>
  </select></div>
  <div style="margin-top:8px">lib/site-physics.ts · rules, not ML</div>
</div>

<div class="hud bl" id="report"></div>

<div class="hud br legend">
  <div><i style="color:#FF7A1A;background:#FF7A1A"></i>Regolith surface (MOLA-ish)</div>
  <div><i style="color:#3DF2E0;background:#3DF2E0"></i>Habitat ring · airlocks</div>
  <div><i style="color:#FF2BD6;background:#FF2BD6"></i>Greenhouse · skylight shaft</div>
  <div><i style="color:#FF3B5C;background:#FF3B5C"></i>Reactor · SEP storm shelter</div>
  <div><i style="color:#8CE07A;background:#8CE07A"></i>Depth datums</div>
  <div class="hint">drag · orbit &nbsp; wheel · zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- physics, ported 1:1 from lib/site-physics.ts ---------- */
const P={RAD:0.64,ATT:45,GCOL:22,GEL:-4400,H:11100,RHO:1.5,REG:70,TGT:20,SEP:0.25,P0:610,RCO2:188.9,T:217,DIFF:3e-7,YR:5.94e7,SOL:88775,Q:0.02,K:2};
const column=e=>P.GCOL*Math.exp(-(e-P.GEL)/P.H);
const surfDose=e=>P.RAD*Math.exp((P.GCOL-column(e))/P.ATT);
const shield=e=>{const a=surfDose(e)*365.25;return a<=P.TGT?0:Math.max(0,(P.REG/P.RHO/100)*Math.log(a/P.TGT));};
const rho=e=>P.P0*Math.exp(-e/P.H)/(P.RCO2*P.T);
const windPa=(e,v)=>0.5*rho(e)*v*v;
const skin=T=>Math.sqrt(P.DIFF*T/Math.PI);
const SITES={jezero:{elev:-2500,name:"Jezero"},gale:{elev:-4400,name:"Gale"},arsia:{elev:8500,name:"Arsia Mons"},hellas:{elev:-7000,name:"Hellas"}};

/* ---------- scene ---------- */
const canvas=document.getElementById('c');
let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(err){const d=document.getElementById('nogl');d.style.display='grid';d.textContent='WebGL unavailable: '+err.message;throw err;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.localClippingEnabled=true;
const CUT=[new THREE.Plane(new THREE.Vector3(0,0,-1),0)]; // keep z<0 half of the ground, open the front
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0B0908);
scene.fog=new THREE.FogExp2(0x0B0908,0.010);
const cam=new THREE.PerspectiveCamera(50,1,0.1,400);

const OCHRE=0xFF7A1A,CYAN=0x3DF2E0,MAG=0xFF2BD6,ALARM=0xFF3B5C,OK=0x8CE07A;
const wire=(c,o=.9)=>new THREE.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:o});
const glass=(c,o=.12)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,side:THREE.DoubleSide,depthWrite:false});
const glowTex=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(cv);})();
const glow=(c,s=2)=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));sp.scale.set(s,s,1);return sp;};

/* stars */
{const n=1500,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const r=180,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);pos[i*3]=r*Math.sin(p)*Math.cos(t);pos[i*3+1]=Math.abs(r*Math.cos(p))+5;pos[i*3+2]=r*Math.sin(p)*Math.sin(t);}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xEDE3D2,size:.35,transparent:true,opacity:.7})));}

/* terrain surface: displaced plane, wireframe ochre, cut away in the front half */
const W=60,D=60,SEG=70,DEPTH=14;
const tg=new THREE.PlaneGeometry(W,D,SEG,SEG);tg.rotateX(-Math.PI/2);
{const p=tg.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);const h=Math.sin(x*.21)*Math.cos(z*.17)*.9+Math.sin(x*.7+z*.4)*.25+Math.cos((x-z)*.35)*.4;p.setY(i,h);}tg.computeVertexNormals();}
const tw=wire(OCHRE,.55);tw.clippingPlanes=CUT;const terrain=new THREE.Mesh(tg,tw);scene.add(terrain);
scene.add(new THREE.Mesh(tg,new THREE.MeshBasicMaterial({color:0x16110E,transparent:true,opacity:.92,polygonOffset:true,polygonOffsetFactor:1,clippingPlanes:CUT})));
// section face: dark wall at z=0 so the cut reads as solid ground
{const fg=new THREE.PlaneGeometry(W,DEPTH);const fm=new THREE.Mesh(fg,new THREE.MeshBasicMaterial({color:0x1F1712,transparent:true,opacity:.35,side:THREE.DoubleSide,depthWrite:false}));fm.position.y=-DEPTH/2;scene.add(fm);}

/* regolith cut block (dark translucent slab, front face open) */

{const g=new THREE.BoxGeometry(W,DEPTH,D);const gm=glass(0x8A3A1C,.10);gm.clippingPlanes=CUT;const m=new THREE.Mesh(g,gm);m.position.y=-DEPTH/2;scene.add(m);
const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x8A3A1C}));e.position.y=-DEPTH/2;scene.add(e);}

/* grid floor under everything */
{const gh=new THREE.GridHelper(W,30,0x3A2A20,0x1F1712);gh.position.y=-DEPTH;scene.add(gh);}

/* ---------- settlement ---------- */
const hab=new THREE.Group();scene.add(hab);
const tube=(a,b,r,c)=>{const v=new THREE.Vector3().subVectors(b,a);const g=new THREE.CylinderGeometry(r,r,v.length(),12,1,true);const m=new THREE.Mesh(g,wire(c,.7));m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize());return m;};
const ring=(r,y,c,w=.06)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(r,w,6,80),new THREE.MeshBasicMaterial({color:c}));m.rotation.x=Math.PI/2;m.position.y=y;return m;};

let habY=-4;   // set from physics per site
const nodes=[];
function buildSettlement(coverM){
  while(hab.children.length)hab.remove(hab.children[0]);nodes.length=0;
  habY=-(coverM+2.2);   // module crown sits coverM below surface, modules are ~4.4 m tall
  const Y=habY;
  // central hub
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(4,4,4.4,24,1,true),wire(CYAN,.85));hub.position.y=Y;hab.add(hub);
  hab.add(new THREE.Mesh(new THREE.CylinderGeometry(4,4,4.4,24,1,true),glass(CYAN,.1)).translateY(Y));
  hab.add(ring(4.2,Y+2.2,CYAN));hab.add(ring(4.2,Y-2.2,CYAN));
  const core=glow(CYAN,7);core.position.y=Y;hab.add(core);
  // six habitat pods on a ring, with spokes
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2,R=13,x=Math.cos(a)*R,z=Math.sin(a)*R;
    const pod=new THREE.Mesh(new THREE.SphereGeometry(2.2,14,10),wire(CYAN,.75));pod.scale.set(1.8,1,1);pod.rotation.y=-a;pod.position.set(x,Y,z);hab.add(pod);
    hab.add(tube(new THREE.Vector3(Math.cos(a)*4,Y,Math.sin(a)*4),new THREE.Vector3(x,Y,z),.9,CYAN));
    const g=glow(CYAN,3.5);g.position.set(x,Y,z);hab.add(g);nodes.push(g);
    // pod-to-pod arc tunnels
    const a2=(i+1)/6*Math.PI*2;hab.add(tube(new THREE.Vector3(x,Y,z),new THREE.Vector3(Math.cos(a2)*R,Y,Math.sin(a2)*R),.6,0x1e7f76));
  }
  // greenhouse: shallow dome + skylight shaft to surface (magenta)
  const gh=new THREE.Mesh(new THREE.SphereGeometry(4.5,20,12,0,Math.PI*2,0,Math.PI/2),wire(MAG,.8));gh.position.set(-19,-1.6,-14);hab.add(gh);
  hab.add(new THREE.Mesh(new THREE.SphereGeometry(4.5,20,12,0,Math.PI*2,0,Math.PI/2),glass(MAG,.12)).translateX(-19).translateY(-1.6).translateZ(-14));
  hab.add(tube(new THREE.Vector3(-19,-1.6,-14),new THREE.Vector3(-19,1.2,-14),1.4,MAG));
  hab.add(tube(new THREE.Vector3(-19,-1.6,-14),new THREE.Vector3(-13,Y,-7.5),.8,MAG));
  const gg=glow(MAG,6);gg.position.set(-19,-1,-14);hab.add(gg);
  // reactor deep, and SEP storm shelter
  const rx=new THREE.Mesh(new THREE.OctahedronGeometry(2.6,1),wire(ALARM,.9));rx.position.set(0,-DEPTH+3.2,0);hab.add(rx);
  hab.add(tube(new THREE.Vector3(0,Y-2.2,0),new THREE.Vector3(0,-DEPTH+3.2,0),.7,ALARM));
  const rg=glow(ALARM,7);rg.position.copy(rx.position);hab.add(rg);nodes.push(rg);
  // surface airlock + mast
  hab.add(tube(new THREE.Vector3(13,Y,0),new THREE.Vector3(20,1.5,6),1,CYAN));
  const al=new THREE.Mesh(new THREE.BoxGeometry(3,2,3),wire(CYAN,.9));al.position.set(20,2.2,6);hab.add(al);
  hab.add(tube(new THREE.Vector3(22,2.5,8),new THREE.Vector3(22,9,8),.15,OCHRE));const mg=glow(OCHRE,2.5);mg.position.set(22,9,8);hab.add(mg);
}

/* ---------- depth datums ---------- */
const datums=new THREE.Group();scene.add(datums);
const labelSprite=(txt,c)=>{const cv=document.createElement('canvas');cv.width=512;cv.height=64;const g=cv.getContext('2d');g.font='600 30px JetBrains Mono, monospace';g.fillStyle=c;g.shadowColor=c;g.shadowBlur=12;g.fillText(txt,8,44);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false}));sp.scale.set(12,1.5,1);return sp;};
function buildDatums(list){
  while(datums.children.length)datums.remove(datums.children[0]);
  for(const d of list){const g=new THREE.PlaneGeometry(W,D,1,1);g.rotateX(-Math.PI/2);
    const m=new THREE.Mesh(g,glass(d.c,.06));m.position.y=-d.m;datums.add(m);
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:d.c,transparent:true,opacity:.9}));e.position.y=-d.m;datums.add(e);
    const l=labelSprite(`${d.t}  ${d.m.toFixed(2)} m`,'#'+d.c.toString(16).padStart(6,'0'));l.position.set(-W/2+7,-d.m+.9,D/2+1);datums.add(l);}
}

/* ---------- report ---------- */
function apply(key){
  const s=SITES[key],e=s.elev;
  const cover=shield(e),dose=surfDose(e),ann=skin(P.YR),diu=skin(P.SOL);
  const peak=windPa(e,25.3),storm=windPa(e,14.2),earth=0.5*1.225*25.3*25.3;
  buildSettlement(cover);
  buildDatums([{t:'SEP shelter',m:P.SEP,c:ALARM},{t:'Annual thermal skin',m:ann,c:OK},{t:'20 mSv/yr cover',m:cover,c:CYAN}]);
  const r=(k,v,cls='')=>`<div class="row"><span>${k}</span><b class="${cls}">${v}</b></div>`;
  document.getElementById('report').innerHTML=
    `<div style="color:var(--bone);margin-bottom:6px">${s.name} · ${e>0?'+':''}${(e/1000).toFixed(1)} km MOLA</div>`+
    r('Surface GCR dose',dose.toFixed(2)+' mSv/sol','oc')+
    r('Regolith over crown',cover.toFixed(2)+' m','cy')+
    r('SEP storm shelter',P.SEP.toFixed(2)+' m','al')+
    r('Annual skin depth',ann.toFixed(2)+' m','ok')+
    r('Diurnal skin depth',diu.toFixed(2)+' m','ok')+
    r('Storm-median wind',storm.toFixed(1)+' Pa')+
    r('Peak wind (25.3 m/s)',peak.toFixed(1)+' Pa  vs Earth '+earth.toFixed(0)+' Pa')+
    r('Verdict',cover>1.5?'BURY':'BUILD + BERM',cover>1.5?'cy':'oc');
}
document.getElementById('site').addEventListener('change',ev=>apply(ev.target.value));
apply('jezero');

/* ---------- scan ring + orbit ---------- */
const scan=ring(1,0,CYAN,.05);scene.add(scan);
let theta=Math.PI/2+.35,phi=0.98,dist=68,drag=false,lx=0,ly=0,auto=true;
canvas.addEventListener('pointerdown',e=>{drag=true;auto=false;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-lx)*.006;phi=Math.max(.25,Math.min(1.45,phi+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY;});
canvas.addEventListener('wheel',e=>{dist=Math.max(25,Math.min(140,dist+e.deltaY*.05));},{passive:true});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();
  if(auto)theta=Math.PI/2+.45*Math.sin(t*.12);
  const target=new THREE.Vector3(0,-7,0);
  cam.position.set(target.x+dist*Math.sin(phi)*Math.cos(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.sin(theta));cam.lookAt(target);
  const s=1+((t*.6)%1)*26;scan.scale.set(s,s,1);scan.material.opacity=1-((t*.6)%1);scan.material.transparent=true;scan.position.y=habY;
  nodes.forEach((n,i)=>{const k=1+.25*Math.sin(t*3+i);n.scale.set(n.userData.s||(n.userData.s=n.scale.x),0,0);n.scale.set(n.userData.s*k,n.userData.s*k,1);});
  terrain.material.opacity=.45+.15*Math.sin(t*1.3);
  renderer.render(scene,cam);})();
</script>
</body>
</html>
